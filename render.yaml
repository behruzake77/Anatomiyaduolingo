# CORPUS — Render Blueprint (one-click deploy)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: corpus
    runtime: node
    rootDir: .
    plan: free
    buildCommand: pnpm install --frozen-lockfile --prod=false && PORT=10000 BASE_PATH=/ pnpm --filter @workspace/corpus run build
    startCommand: PORT=10000 BASE_PATH=/ pnpm --filter @workspace/corpus run serve
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
