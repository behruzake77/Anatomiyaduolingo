# CORPUS — Render Blueprint (one-click deploy)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: corpus
    runtime: node
    rootDir: .migration-backup/corpus
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
