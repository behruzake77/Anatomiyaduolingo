<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>AnatomiLingo — Anatomiyani o'rgan</title>
<meta name="description" content="Anatomiyani Duolingo uslubida o'rganing — suyaklar, bo'g'imlar, mushaklar, ichki a'zolar">
<meta name="theme-color" content="#090D18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
<link rel="icon" type="image/png" href="assets/icons/favicon.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css">

<style>
/* ============================================================
   CORPUS — Premium cinematic startup sequence
   No external libraries/assets required.
   ============================================================ */
.splash.corpus-splash {
  position: fixed;
  inset: 0;
  z-index: 99999;
  isolation: isolate;
  overflow: hidden;
  display: grid;
  place-items: center;
  min-height: 100dvh;
  padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
  background:
    radial-gradient(circle at 50% 42%, rgba(139,108,255,.34), transparent 26%),
    radial-gradient(circle at 15% 15%, rgba(32,217,197,.10), transparent 28%),
    radial-gradient(circle at 88% 82%, rgba(124,92,255,.16), transparent 32%),
    linear-gradient(145deg, #080b18 0%, #11122b 46%, #17133a 100%);
  transition: opacity .8s cubic-bezier(.22,1,.36,1), visibility .8s;
}

.corpus-splash::before,
.corpus-splash::after {
  content: "";
  position: absolute;
  inset: -35%;
  pointer-events: none;
  z-index: -1;
  background: conic-gradient(from 0deg, transparent 0 18%, rgba(139,108,255,.13) 24%, transparent 34% 58%, rgba(32,217,197,.08) 66%, transparent 76% 100%);
  animation: corpusSpin 14s linear infinite;
}
.corpus-splash::after {
  inset: -10%;
  opacity: .42;
  filter: blur(34px);
  animation-direction: reverse;
  animation-duration: 20s;
}

.corpus-particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.corpus-particles i {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgba(255,255,255,.65);
  box-shadow: 0 0 12px rgba(139,108,255,.9);
  animation: corpusFloat 3.8s ease-in-out infinite;
}
.corpus-particles i:nth-child(1){left:12%;top:28%;animation-delay:-1.2s}
.corpus-particles i:nth-child(2){left:20%;top:64%;animation-delay:-2.4s}
.corpus-particles i:nth-child(3){left:78%;top:22%;animation-delay:-.7s}
.corpus-particles i:nth-child(4){left:87%;top:59%;animation-delay:-3s}
.corpus-particles i:nth-child(5){left:72%;top:76%;animation-delay:-1.8s}
.corpus-particles i:nth-child(6){left:28%;top:18%;animation-delay:-2.8s}
.corpus-particles i:nth-child(7){left:8%;top:78%;animation-delay:-.4s}
.corpus-particles i:nth-child(8){left:92%;top:36%;animation-delay:-2s}

.corpus-stage {
  position: relative;
  width: min(390px, 88vw);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  transform: translateY(-1vh);
}

.corpus-orbit {
  position: absolute;
  width: 280px;
  height: 280px;
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 50%;
  transform: rotate(-18deg) scaleY(.42);
  opacity: 0;
  animation: corpusOrbitIn 1.1s .15s cubic-bezier(.22,1,.36,1) forwards;
}
.corpus-orbit::before,
.corpus-orbit::after {
  content: "";
  position: absolute;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  top: 50%;
  left: -3px;
  background: #8b6cff;
  box-shadow: 0 0 18px #8b6cff;
}
.corpus-orbit::after {
  left: auto;
  right: -3px;
  background: #20d9c5;
  box-shadow: 0 0 18px #20d9c5;
}

.corpus-logo-wrap {
  position: relative;
  width: 190px;
  height: 190px;
  display: grid;
  place-items: center;
  margin-bottom: 24px;
  opacity: 0;
  transform: scale(.72) translateY(18px);
  animation: corpusLogoIn 1s .25s cubic-bezier(.22,1,.36,1) forwards;
}
.corpus-logo-wrap::before {
  content: "";
  position: absolute;
  inset: 10px;
  border-radius: 42px;
  background: radial-gradient(circle, rgba(139,108,255,.34), transparent 68%);
  filter: blur(18px);
  animation: corpusPulse 2.6s ease-in-out .8s infinite;
}
.corpus-logo-wrap::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 46px;
  border: 1px solid rgba(255,255,255,.14);
  box-shadow: inset 0 0 40px rgba(255,255,255,.06), 0 0 60px rgba(108,92,231,.22);
  animation: corpusBorder 2.8s ease-in-out infinite;
}
.corpus-logo {
  position: relative;
  z-index: 2;
  width: 154px;
  height: 154px;
  object-fit: contain;
  border-radius: 38px;
  filter: drop-shadow(0 18px 30px rgba(0,0,0,.38));
}

.corpus-wordmark {
  position: relative;
  font-family: var(--f-head, Poppins, system-ui, sans-serif);
  font-size: clamp(42px, 12vw, 58px);
  line-height: .95;
  font-weight: 800;
  letter-spacing: .055em;
  color: #fff;
  opacity: 0;
  transform: translateY(16px);
  text-shadow: 0 0 28px rgba(139,108,255,.26);
  animation: corpusTextIn .8s .82s cubic-bezier(.22,1,.36,1) forwards;
}
.corpus-wordmark span {
  display: inline-block;
  background: linear-gradient(110deg, #fff 0%, #e7e0ff 42%, #a997ff 72%, #fff 100%);
  background-size: 220% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: corpusShine 2.8s 1.4s ease-in-out infinite;
}

.corpus-tagline {
  margin-top: 14px;
  color: rgba(255,255,255,.72);
  font-family: var(--f-body, Inter, system-ui, sans-serif);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .02em;
  opacity: 0;
  transform: translateY(10px);
  animation: corpusTextIn .8s 1.08s cubic-bezier(.22,1,.36,1) forwards;
}

.corpus-status {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 30px;
  color: rgba(255,255,255,.46);
  font: 700 9px/1 var(--f-body, Inter, sans-serif);
  letter-spacing: .22em;
  text-transform: uppercase;
  opacity: 0;
  animation: corpusFade .7s 1.35s ease forwards;
}
.corpus-status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #20d9c5;
  box-shadow: 0 0 12px rgba(32,217,197,.9);
  animation: corpusBlink 1s ease-in-out infinite;
}

.corpus-progress {
  position: relative;
  width: min(300px, 72vw);
  height: 4px;
  margin-top: 18px;
  border-radius: 99px;
  overflow: hidden;
  background: rgba(255,255,255,.10);
  opacity: 0;
  animation: corpusFade .6s 1.45s ease forwards;
}
.corpus-progress::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, #6c5ce7, #8b6cff 55%, #20d9c5);
  box-shadow: 0 0 18px rgba(139,108,255,.7);
  animation: corpusProgress 2.35s 1.35s cubic-bezier(.22,1,.36,1) forwards;
}
.corpus-progress::after {
  content: "";
  position: absolute;
  top: -3px;
  left: -20%;
  width: 22%;
  height: 10px;
  border-radius: 99px;
  background: rgba(255,255,255,.85);
  filter: blur(5px);
  animation: corpusSweep 2.35s 1.35s cubic-bezier(.22,1,.36,1) forwards;
}

.corpus-splash.is-leaving {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

@keyframes corpusLogoIn { to { opacity:1; transform:scale(1) translateY(0); } }
@keyframes corpusOrbitIn { to { opacity:1; transform:rotate(-18deg) scaleY(.42); } }
@keyframes corpusTextIn { to { opacity:1; transform:translateY(0); } }
@keyframes corpusFade { to { opacity:1; } }
@keyframes corpusPulse { 0%,100%{transform:scale(.92);opacity:.65} 50%{transform:scale(1.08);opacity:1} }
@keyframes corpusBorder { 0%,100%{opacity:.6} 50%{opacity:1} }
@keyframes corpusShine { 0%,65%,100%{background-position:200% 0} 82%{background-position:-20% 0} }
@keyframes corpusProgress { to { width:100%; } }
@keyframes corpusSweep { to { left:110%; } }
@keyframes corpusSpin { to { transform:rotate(360deg); } }
@keyframes corpusFloat { 0%,100%{transform:translate3d(0,0,0);opacity:.25} 50%{transform:translate3d(0,-18px,0);opacity:.9} }
@keyframes corpusBlink { 0%,100%{opacity:.35} 50%{opacity:1} }

@media (prefers-reduced-motion: reduce) {
  .corpus-splash * { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}
</style>
</head>
<body>
<div class="splash corpus-splash" id="splash" aria-label="CORPUS yuklanmoqda">
  <div class="corpus-particles" aria-hidden="true">
    <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
  </div>
  <div class="corpus-stage">
    <div class="corpus-orbit" aria-hidden="true"></div>
    <div class="corpus-logo-wrap">
      <img class="corpus-logo" src="assets/icons/logo.svg" alt="CORPUS">
    </div>
    <div class="corpus-wordmark"><span>CORPUS</span></div>
    <div class="corpus-tagline">Anatomiyani o'rgan. Hayotni boshqar.</div>
    <div class="corpus-status"><span class="corpus-status-dot"></span><span>Tizim ishga tushmoqda</span></div>
    <div class="corpus-progress" aria-hidden="true"></div>
  </div>
</div>

<div id="app"></div>
<script src="js/content.js"></script>
<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  const splash = document.getElementById('splash');
  if (!splash) return;

  const started = performance.now();
  const finish = () => {
    const elapsed = performance.now() - started;
    const delay = Math.max(0, 3100 - elapsed);
    setTimeout(() => splash.classList.add('is-leaving'), delay);
    setTimeout(() => splash.remove(), delay + 900);
  };

  if (document.readyState === 'complete') finish();
  else window.addEventListener('load', finish, { once: true });

  // Never trap the user behind the splash if a resource hangs.
  setTimeout(() => splash.classList.add('is-leaving'), 6500);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
