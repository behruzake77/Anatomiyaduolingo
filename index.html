<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>AnatomiLingo — Anatomiyani o'rgan</title>
<meta name="description" content="Anatomiyani Duolingo uslubida o'rganing — suyaklar, bo'g'imlar, mushaklar, ichki a'zolar">
<meta name="theme-color" content="#090D18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
<link rel="icon" type="image/png" href="assets/icons/favicon.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css">

<style>
/* ============================================================
   ANATOMYDUOLINGO / CORPUS — Intelligent Anatomical Opening Experience
   Design Philosophy: Medical Precision · Progressive Disclosure · Calm Confidence
   Motion Curve: cubic-bezier(0.16, 1, 0.3, 1) [Apple/iOS spring-like deceleration]
   ============================================================ */
.splash.corpus-splash {
  position: fixed;
  inset: 0;
  z-index: 99999;
  isolation: isolate;
  overflow: hidden;
  display: grid;
  place-items: center;
  min-height: 100dvh;
  padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
  background: #070914;
  transition: opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1), transform 0.75s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.75s;
  will-change: opacity, transform;
}

/* 1. Precision Grid & Vignette */
.corpus-grid-bg {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
  background-size: 44px 44px;
  background-position: center center;
  opacity: 0;
  animation: gridResolve 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.corpus-grid-bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 45%, rgba(124, 92, 255, 0.12) 0%, transparent 65%),
              radial-gradient(circle at 50% 50%, transparent 30%, #070914 90%);
}

.corpus-stage {
  position: relative;
  width: min(380px, 88vw);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  z-index: 2;
}

/* 2. Anatomical Precision Reticle (Focal Ring & Sagittal Axis) */
.corpus-reticle {
  position: absolute;
  top: 90px;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.65);
  width: 260px;
  height: 260px;
  pointer-events: none;
  opacity: 0;
  animation: reticleFocus 1.1s 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Sagittal Axis Line */
.corpus-sagittal-axis {
  position: absolute;
  top: -20px;
  bottom: -20px;
  left: 50%;
  width: 1px;
  background: linear-gradient(to bottom, transparent, rgba(32, 217, 197, 0.4) 30%, rgba(124, 92, 255, 0.5) 70%, transparent);
  transform: scaleY(0);
  transform-origin: center center;
  animation: sagittalReveal 1s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Concentric Medical Focal Rings */
.corpus-focal-ring-outer {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px dashed rgba(255, 255, 255, 0.12);
}

.corpus-focal-ring-inner {
  position: absolute;
  inset: 24px;
  border-radius: 50%;
  border: 1px solid rgba(124, 92, 255, 0.25);
  box-shadow: 0 0 40px rgba(124, 92, 255, 0.08);
}

/* Precision Corner Markers */
.corpus-corner-tick {
  position: absolute;
  width: 8px;
  height: 8px;
  border-color: rgba(32, 217, 197, 0.6);
  border-style: solid;
}
.corpus-corner-tick.tl { top: 38px; left: 38px; border-width: 1.5px 0 0 1.5px; }
.corpus-corner-tick.tr { top: 38px; right: 38px; border-width: 1.5px 1.5px 0 0; }
.corpus-corner-tick.bl { bottom: 38px; left: 38px; border-width: 0 0 1.5px 1.5px; }
.corpus-corner-tick.br { bottom: 38px; right: 38px; border-width: 0 1.5px 1.5px 0; }

/* 3. Emblem / Logo Vessel */
.corpus-emblem-container {
  position: relative;
  width: 160px;
  height: 160px;
  display: grid;
  place-items: center;
  margin-bottom: 28px;
  opacity: 0;
  transform: scale(0.85) translateY(12px);
  animation: emblemEmerge 1s 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.corpus-emblem-glow {
  position: absolute;
  inset: 8px;
  border-radius: 40px;
  background: radial-gradient(circle, rgba(124, 92, 255, 0.28) 0%, rgba(32, 217, 197, 0.12) 55%, transparent 75%);
  filter: blur(14px);
  opacity: 0.85;
}

.corpus-emblem-frame {
  position: absolute;
  inset: 0;
  border-radius: 44px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(13, 19, 36, 0.65);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
}

.corpus-logo-img {
  position: relative;
  z-index: 3;
  width: 128px;
  height: 128px;
  object-fit: contain;
  border-radius: 34px;
  filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.4));
}

/* 4. Progressive Brand Typography & Metadata */
.corpus-brand-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  opacity: 0;
  transform: translateY(8px);
  animation: elementRise 0.75s 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.corpus-meta-badge {
  font-family: var(--f-body, Inter, system-ui, sans-serif);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--teal, #20d9c5);
  background: rgba(32, 217, 197, 0.1);
  border: 1px solid rgba(32, 217, 197, 0.25);
  padding: 3px 10px;
  border-radius: 20px;
}

.corpus-wordmark-title {
  position: relative;
  font-family: var(--f-head, Poppins, system-ui, sans-serif);
  font-size: clamp(38px, 10vw, 50px);
  line-height: 1;
  font-weight: 800;
  letter-spacing: 0.04em;
  color: #ffffff;
  opacity: 0;
  transform: translateY(12px);
  animation: elementRise 0.85s 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.corpus-wordmark-title span.accent {
  color: var(--purple-3, #8b6cff);
}

.corpus-tagline-text {
  margin-top: 10px;
  color: rgba(248, 250, 252, 0.75);
  font-family: var(--f-body, Inter, system-ui, sans-serif);
  font-size: 13.5px;
  font-weight: 500;
  letter-spacing: 0.01em;
  opacity: 0;
  transform: translateY(8px);
  animation: elementRise 0.75s 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* 5. Precise System Initialization Status */
.corpus-system-status {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 32px;
  color: rgba(255, 255, 255, 0.55);
  font-family: var(--f-body, Inter, system-ui, sans-serif);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  opacity: 0;
  animation: elementFade 0.7s 1.05s ease forwards;
}

.corpus-status-indicator {
  position: relative;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #20d9c5;
  box-shadow: 0 0 10px rgba(32, 217, 197, 0.8);
}

/* Calibrated Precision Progress Gauge */
.corpus-progress-gauge {
  position: relative;
  width: min(240px, 64vw);
  height: 3px;
  margin-top: 14px;
  border-radius: 99px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.08);
  opacity: 0;
  animation: elementFade 0.6s 1.15s ease forwards;
}

.corpus-progress-gauge::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 0%;
  border-radius: inherit;
  background: linear-gradient(90deg, #6c5ce7 0%, #8b6cff 60%, #20d9c5 100%);
  box-shadow: 0 0 14px rgba(139, 108, 255, 0.6);
  animation: gaugeCalibrate 1.2s 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* 6. Fluid App Reveal Transition */
.corpus-splash.is-leaving {
  opacity: 0;
  transform: scale(1.03);
  visibility: hidden;
  pointer-events: none;
}

/* Keyframe Choreography */
@keyframes gridResolve {
  to { opacity: 1; }
}

@keyframes sagittalReveal {
  to { transform: scaleY(1); }
}

@keyframes reticleFocus {
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

@keyframes emblemEmerge {
  to { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes elementRise {
  to { opacity: 1; transform: translateY(0); }
}

@keyframes elementFade {
  to { opacity: 1; }
}

@keyframes gaugeCalibrate {
  0% { width: 0%; }
  60% { width: 75%; }
  100% { width: 100%; }
}

/* Accessibility: Prefers Reduced Motion */
@media (prefers-reduced-motion: reduce) {
  .corpus-splash {
    transition: opacity 0.2s linear, visibility 0.2s !important;
  }
  .corpus-grid-bg,
  .corpus-reticle,
  .corpus-sagittal-axis,
  .corpus-emblem-container,
  .corpus-brand-meta,
  .corpus-wordmark-title,
  .corpus-tagline-text,
  .corpus-system-status,
  .corpus-progress-gauge,
  .corpus-progress-gauge::before {
    animation-duration: 0.01ms !important;
    animation-delay: 0ms !important;
    opacity: 1 !important;
    transform: none !important;
    width: 100% !important;
  }
}
</style>
</head>
<body>
<div class="splash corpus-splash" id="splash" aria-label="AnatomyDuolingo tizimi ishga tushmoqda">
  <div class="corpus-grid-bg" aria-hidden="true"></div>
  <div class="corpus-stage">
    <div class="corpus-reticle" aria-hidden="true">
      <div class="corpus-sagittal-axis"></div>
      <div class="corpus-focal-ring-outer"></div>
      <div class="corpus-focal-ring-inner"></div>
      <div class="corpus-corner-tick tl"></div>
      <div class="corpus-corner-tick tr"></div>
      <div class="corpus-corner-tick bl"></div>
      <div class="corpus-corner-tick br"></div>
    </div>

    <div class="corpus-emblem-container">
      <div class="corpus-emblem-glow"></div>
      <div class="corpus-emblem-frame"></div>
      <img class="corpus-logo-img" src="assets/icons/logo.svg" alt="AnatomyDuolingo Logo">
    </div>

    <div class="corpus-brand-meta">
      <span class="corpus-meta-badge">Tibbiy Platforma</span>
    </div>

    <h1 class="corpus-wordmark-title">CORPUS<span class="accent">.</span></h1>
    <p class="corpus-tagline-text">Anatomiyani o'rgan. Hayotni boshqar.</p>

    <div class="corpus-system-status">
      <span class="corpus-status-indicator"></span>
      <span>Tizim tayyorlanmoqda</span>
    </div>
    <div class="corpus-progress-gauge" aria-hidden="true"></div>
  </div>
</div>

<div id="app"></div>
<script src="js/content.js"></script>
<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  const splash = document.getElementById('splash');
  if (!splash) return;

  const started = performance.now();
  let finished = false;

  const dismissSplash = () => {
    if (finished) return;
    finished = true;

    // Minimum display duration (2400ms) for choreographed 6-phase sequence
    const elapsed = performance.now() - started;
    const delay = Math.max(0, 2400 - elapsed);

    setTimeout(() => {
      splash.classList.add('is-leaving');
    }, delay);

    // Cleanly unmount splash from DOM after exit transition
    setTimeout(() => {
      if (splash.parentNode) splash.remove();
    }, delay + 800);
  };

  if (document.readyState === 'complete') {
    dismissSplash();
  } else {
    window.addEventListener('load', dismissSplash, { once: true });
  }

  // Safety fallback: Never trap the user if network or asset loading hangs
  setTimeout(dismissSplash, 4200);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
